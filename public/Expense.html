<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
   <h1>Expense Tracker Dashboard</h1>
   <button id="logoutBtn">Logout</button>

    <div class="main">

      <form>
         <select  id="optionpage">
            <option value="2" class="optionpage1">2</option>
            <option value="5" selected class="optionpage1">5</option>
            <option value="10" class="optionpage1">10</option>
        </select>
        <!-- <label id="input" >Expense</label> -->
        <input name="input" id="inputval" type="number" placeholder="Rupes" />

        <!-- <label id="desc">Description</label> -->
        <input type="text" id="descinput" placeholder="Description" />

        <!--         
        <label id="category">Category</label> -->
        <select type="select" id="select" aria-placeholder="Category" style="background-color: rgb(29, 28, 28);">
          <option>Generated by AI</option>
          <option>Movies</option>
          <option>Drink</option>
          <option>Travel</option>
          <option>Food</option>
          <option>Casino</option>
          <option>Stay</option>
          <option>Shoping</option>
          <option>Medicine</option>
          <option>vagies</option>
          <option>enjoyment</option>
        </select>

        <button itemid="submit-btn" type="submit" id="btn">ADD</button>
      </form>
    </div>

    <div class="secdiv">
      <ul id="list"></ul>
    </div>

    <div class="pagesDiv">
      <button id="prevBtn">Previous</button>
      <span id="pageInfo"></span>
      <button id="nextBtn">Next</button>
    </div>

    <div class="btnmaindiv">
      <div class="threebtn">
        <button class="showpremuiumbutton">ShowPremiumUser</button>
        <button class="buyMembership">buy membership</button>
        <button id="DownloadExpenses">Download</button>
      </div>

       <ul id="premiumUSerList"></ul>

      <!-- <div class="contenturl">
         <ul id="contentList"> </ul>
      </div> -->

    </div>

    <!-- <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script> -->
    <script src="./axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="Expense.js"></script>
  </body>
</html>
